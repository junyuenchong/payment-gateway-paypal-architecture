services:
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
        NEXT_PUBLIC_PAYPAL_SUPPORTED_CURRENCIES: MYR
    restart: unless-stopped
    ports:
      - "8080:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ./backend/.env
    ports:
      # If host port 3000 is taken (local Nest, etc.), set e.g. BACKEND_PORT=3010 docker compose up
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://payment:payment@postgres:5432/payment?schema=public
      NODE_ENV: production
      PORT: 3000
      FRONTEND_BASE_URL: http://localhost:8080
      BULLMQ_REDIS_HOST: redis
      BULLMQ_REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payment
    volumes:
      - payment_pg_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  payment_pg_data:
